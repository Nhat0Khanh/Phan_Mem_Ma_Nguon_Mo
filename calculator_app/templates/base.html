<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Máy tính cơ bản{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Máy Tính Cơ Bản</a>
        </div>
    </nav>

    <main class="container bg-white p-4 rounded shadow-sm my-auto col-md-8 col-lg-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 text-muted border-top bg-white mt-auto">
        <p class="mb-0">&copy; 2026 Calculator App</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

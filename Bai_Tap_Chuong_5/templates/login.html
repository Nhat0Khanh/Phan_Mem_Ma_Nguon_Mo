{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="bg-white p-4 rounded shadow-sm border">
    <h3 class="text-danger fw-bold mb-4 text-center">Đăng nhập</h3>

    <form action="/login" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" required>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" name="remember">
            <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
        </div>

        <div class="mt-4 d-grid gap-2">
            <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng nhập</button>
            <a class="btn btn-danger w-100 fw-bold" href="/register">Đăng ký</a>
        </div>
    </form>
</div>
{% endblock %}
